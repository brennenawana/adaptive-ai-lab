[project]
name = "fis"
version = "0.1.0"
description = "Fintech Integration Sandbox — a clean-room reference project for the Company Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "nats-py>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
# Routing gateway (R-series). Pinned: the R1 equivalence result is a statement
# about this exact build's JSON handling — see infra/switchyard/README.md.
routing = ["nemo-switchyard[cli,server]==0.2.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas", "platform_", "services", "scenarios", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Consumers are async; without this every async test silently reports as failed
# with "async functions are not natively supported".
asyncio_mode = "auto"
