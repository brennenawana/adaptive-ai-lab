# Fintech Integration Sandbox — core infrastructure
#
# Ports are deliberately offset from this machine's existing services:
#   5432 = existing "thewall" PostgreSQL (native, untouched)
#   6379 = existing Redis (untouched)
#   8080 = reserved for Bonsai
#   8081 = reserved for the Qwen3.8-27B llama.cpp server
#
# Profiles let you run only what the current experiment needs:
#   docker compose --profile core up -d
#   docker compose --profile core --profile observability up -d

name: fis

services:
  postgres:
    # pgvector/pgvector ships pgvector already compiled against this PG major.
    image: pgvector/pgvector:pg16
    container_name: fis-postgres
    profiles: [core, full]
    environment:
      POSTGRES_USER: fis
      POSTGRES_PASSWORD: fis_local_dev
      POSTGRES_DB: fis
      # Deterministic collation so ORDER BY is stable across machines —
      # eval reports must not shift because of locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - fis_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fis -d fis"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    container_name: fis-nats
    profiles: [core, full]
    # JetStream on, with a file store so events survive a container restart.
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "127.0.0.1:4222:4222"   # client
      - "127.0.0.1:8222:8222"   # monitoring / healthz
    volumes:
      - fis_natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # Artifact store for trajectory payloads, datasets, and adapters.
    # Guide says "add MinIO only when artifact storage becomes useful" —
    # so it sits outside the core profile until the trajectory store needs it.
    image: minio/minio:latest
    container_name: fis-minio
    profiles: [artifacts, full]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fis
      MINIO_ROOT_PASSWORD: fis_local_dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - fis_miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  fis_pgdata:
  fis_natsdata:
  fis_miniodata:
