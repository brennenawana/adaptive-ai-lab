# Deploy the playbook website (site/) to GitHub Pages.
#
# ONE-TIME OWNER STEP before this can deploy:
#   GitHub → Settings → Pages → "Build and deployment" → Source: GitHub Actions
# Until then, run it manually from the Actions tab (workflow_dispatch) — it will
# fail at the deploy step with a clear "Pages not enabled" error and touch
# nothing else. After enabling Pages, uncomment the push trigger below for
# automatic deploys on content changes.
name: site
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['site/**', 'playbook/**', 'research/**', '.github/workflows/site.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: historical playbook versions are materialized from
          # their release commits at build time
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_URL: https://brennenawana.github.io
          SITE_BASE: /adaptive-ai-lab/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
