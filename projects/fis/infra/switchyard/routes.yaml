# NeMo Switchyard route bundle for FIS — R1 passthrough profile.
#
# Served by `make serve-switchyard` (nemo-switchyard 0.2.0, `switchyard serve`).
# Listener: 127.0.0.1:4000. One route, one backend, no routing decision:
#
#     orchestrator -> Switchyard :4000 -> llama.cpp :8082   (same model as direct)
#
# Contract of this file (see infra/switchyard/README.md):
#   * transport config only — no scenario ids, no class names, no eval fields.
#     tests/test_routing_no_gold_leak.py greps for them.
#   * no secrets. The local backend needs no key; api_key is the empty string ON
#     PURPOSE — an omitted api_key makes Switchyard fall back to $OPENAI_API_KEY
#     and send whatever is in the shell to llama.cpp.
#   * `type: model` is the loader's name for a single-target passthrough (there is
#     no `type: passthrough` in the YAML schema; that spelling belongs to the Rust
#     routes.toml). It mutates exactly one field of the request: `model` is
#     rewritten to the target model. Route id == target model, so even that is a
#     no-op and the body reaching llama.cpp is byte-identical to the direct path.
#   * `format: openai` pinned. `auto` would probe the upstream at startup and
#     require an api_key.
#   * no timeout: llama.cpp generations run long on the 4096-token cap and the
#     FIS adapter already enforces its own 600 s client timeout.

defaults:
  base_url: http://127.0.0.1:8082/v1
  api_key: ""
  format: openai

routes:
  fis-local-specialist:
    type: model
    model: fis-local-specialist
    display_name: FIS local specialist (passthrough)
    description: Qwen3-8B on llama.cpp :8082, reached through Switchyard with no routing decision.
