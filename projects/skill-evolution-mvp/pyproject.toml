[project]
name = "skill-evolution-rig"
version = "0.1.0"
description = "Skill-evolution MVP rig (WikiSkill replication + frontier-optimizer extension)"
requires-python = ">=3.12"
dependencies = [
    # No anthropic SDK: all model calls go through the Claude Code CLI gateway
    # on subscription auth (rig/gateway.py).
    "openpyxl==3.1.3",  # pinned to upstream SpreadsheetBench requirements.txt
    "pandas==2.2.0",    # upstream pin; newer pandas demands openpyxl>=3.1.5 and
                        # sent the executor into a pip loop (found by the wiki, smoke-C)
    "numpy>=1.26",
    "tqdm>=4.66",
]

[tool.uv]
package = false
